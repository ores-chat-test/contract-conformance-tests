name: trust-surface peer-authority proof

on:
  pull_request:
    paths:
      - "proof/trust-surface/**"
      - ".github/workflows/trust-surface-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact proof candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Format Rust semantic proof
        run: cargo fmt --manifest-path proof/trust-surface/rust/Cargo.toml -- --check
      - name: Lint Rust semantic proof
        run: cargo clippy --manifest-path proof/trust-surface/rust/Cargo.toml --all-targets -- -D warnings
      - name: Test canonical Rust semantics against copied authorities
        run: cargo test --manifest-path proof/trust-surface/rust/Cargo.toml --all-targets
      - name: Admit exact copied peer authorities
        uses: ORESoftware/typespec-json-schema-validator@26c3b2c84ed58fd8cb110b14c917beeacb93804c
        with:
          typespec: proof/trust-surface/main.tsp
          schema: proof/trust-surface/authored.schema.json
          report: .typespec-json-schema-validator/trust-surface-report.json
          contract_ir: .typespec-json-schema-validator/trust-surface-ir.json
          output_dir: .typespec-json-schema-validator/trust-surface-generated
          max_probes: "64"
      - name: Prove exact fixture bytes were not rewritten
        run: git diff --exit-code -- proof/trust-surface
      - name: Retain parity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trust-surface-proof-${{ github.sha }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
